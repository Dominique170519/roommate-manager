<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合租生活管家 · 一起住，不吵架</title>
<meta name="description" content="合租生活管家：费用AA分摊、清洁值日排班、公共物品登记与提醒、室友公约管理。">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%230E6B5C"/><path d="M16 6.5 7.5 14v11.5h17V14z" fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"/><path d="M12.5 25.5v-7h7v7" fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"/></svg>'>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface-2:#FBFAF7;
  --ink:#22312C; --ink-2:#5C6B65; --ink-3:#98A49F; --line:#E7E3D9;
  --primary:#0E6B5C; --primary-strong:#0A564A; --primary-soft:#DFF0EB;
  --accent:#E09A2F; --accent-soft:#F9EDD7;
  --danger:#D4534A; --danger-soft:#FBE7E5;
  --ok:#3E8E5A;
  --radius:16px; --radius-s:12px;
  --shadow:0 1px 2px rgba(34,49,44,.05), 0 10px 28px rgba(34,49,44,.07);
  --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
::placeholder{color:var(--ink-3)}

/* ===== 布局骨架 ===== */
.app{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;z-index:40}
.main{margin-left:236px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,242,236,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 34px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.content{max-width:1060px;margin:0 auto;padding:26px 34px 60px}
.tabbar{display:none}

/* ===== 品牌 ===== */
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.brand-name{font-weight:900;font-size:17px;letter-spacing:.5px;line-height:1.25}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:1.5px}
.brand svg{stroke:white}

/* ===== 侧栏导航 ===== */
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14.5px;position:relative;transition:background .15s,color .15s}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:4px;border-radius:4px;background:var(--primary)}
.side-foot{padding:14px 12px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.7}

/* ===== 顶栏 ===== */
.page-title{font-size:21px;font-weight:900;letter-spacing:.3px}
.page-sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.icon-btn svg{width:19px;height:19px}

/* ===== 卡片与区块 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:12px}
.section-title{font-size:16.5px;font-weight:900;letter-spacing:.3px}
.section-link{font-size:13px;color:var(--primary);text-decoration:none;font-weight:500;cursor:pointer;background:none;border:none}
.section-link:hover{text-decoration:underline}

/* ===== 首页 hero ===== */
.hero{background:linear-gradient(135deg,#0E6B5C 0%,#12856F 100%);border-radius:20px;padding:26px 28px;color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:40px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-greet{font-size:13px;opacity:.85}
.hero-title{font-size:24px;font-weight:900;margin:4px 0 2px;letter-spacing:.5px}
.hero-date{font-size:12.5px;opacity:.75}
.hero-row{display:flex;gap:10px;margin-top:18px;position:relative;z-index:2}
.hero-chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:8px 14px;border-radius:999px;font-size:12.5px;display:flex;align-items:center;gap:7px}
.hero-chip b{font-size:15px}
.hero-chip svg{width:15px;height:15px}

/* ===== 统计卡 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stat-label svg{width:14px;height:14px;color:var(--primary)}
.stat-val{font-size:22px;font-weight:900;margin-top:6px;letter-spacing:.2px}
.stat-val small{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:2px}
.stat-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.stat-val.green{color:var(--ok)} .stat-val.red{color:var(--danger)} .stat-val.amber{color:#B9770E}

/* ===== 快捷操作 ===== */
.quick-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;transition:transform .12s,border-color .12s,box-shadow .12s;text-align:left}
.quick:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.quick svg{width:21px;height:21px;color:var(--primary)}
.quick b{font-size:14.5px}
.quick span{font-size:12px;color:var(--ink-2);line-height:1.5}

/* ===== 双栏 ===== */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.cols .card{padding:18px 20px}

/* ===== 列表 ===== */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--ink-2);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.amount{font-weight:900;font-size:15px;white-space:nowrap}
.amount.in{color:var(--ok)} .amount.out{color:var(--danger)} .amount.plain{color:var(--ink)}

/* ===== 徽标 / 标签 ===== */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.5}
.chip.teal{background:var(--primary-soft);color:var(--primary)}
.chip.amber{background:var(--accent-soft);color:#B9770E}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.gray{background:#EFEDE6;color:var(--ink-2)}
.chip.blue{background:#E4EEF7;color:#2E6E9E}
.chip.green{background:#E4F2E9;color:var(--ok)}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:11px;padding:10px 18px;font-size:14px;font-weight:700;transition:all .15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-strong)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{color:var(--primary);border-color:var(--primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.soft:hover{background:#CFE8E0}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.danger:hover{background:#F6D6D3}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px;min-height:34px}
.section-link{font-size:13px;color:var(--primary);text-decoration:none;font-weight:500;cursor:pointer;background:none;border:none;padding:5px 2px;margin:-5px -2px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ===== 表单 ===== */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.input,select.input{width:100%;padding:10.5px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);outline:none;transition:border .15s,background .15s;appearance:none}
.input:focus{border-color:var(--primary);background:#fff}
textarea.input{resize:vertical;min-height:72px}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.check-chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-2);transition:all .12s;display:inline-flex;align-items:center;gap:6px}
.check-chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
.avatar{width:24px;height:24px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.avatar.lg{width:34px;height:34px;font-size:14px}
.avatar.sm{width:20px;height:20px;font-size:10px}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(24,35,31,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .18s ease}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px;animation:slideUp .22s ease}
@media(min-width:640px){
  .modal-mask{align-items:center;padding:24px}
  .modal{border-radius:20px}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:17px;font-weight:900}
.modal-x{background:none;border:none;color:var(--ink-3);width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--surface-2);color:var(--ink)}
.modal-x svg{width:17px;height:17px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(26px);opacity:.6}}

/* ===== Toast ===== */
.toast-root{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .25s ease;display:flex;align-items:center;gap:8px}
.toast svg{width:15px;height:15px;color:#7FD6B9}
@keyframes toastIn{from{transform:translateY(-14px);opacity:0}}

/* ===== 费用视图 ===== */
.seg{display:inline-flex;background:#ECE9E0;border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:7px 16px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.expense-date{font-size:12px;color:var(--ink-3);font-weight:700;padding:10px 4px 6px;display:flex;align-items:center;gap:8px}
.expense-date::after{content:"";flex:1;height:1px;background:var(--line)}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut-hole{position:absolute;inset:22px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-hole b{font-size:17px;font-weight:900}
.donut-hole span{font-size:11px;color:var(--ink-3)}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend-row .v{margin-left:auto;font-weight:700}
.legend-row .p{color:var(--ink-3);width:44px;text-align:right}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-name{width:56px;font-size:12.5px;color:var(--ink-2);flex:none;display:flex;align-items:center;gap:6px}
.bar-track{flex:1;height:10px;background:#EFEDE6;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:var(--primary);transition:width .4s ease}
.bar-val{width:74px;font-size:12.5px;font-weight:700;text-align:right;flex:none}
.trend-wrap{width:100%}
.balance-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px dashed var(--line)}
.balance-row:last-child{border-bottom:none}
.transfer-list{display:flex;flex-direction:column;gap:8px}
.transfer{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px}
.transfer .arrow{color:var(--ink-3)}
.transfer b{color:var(--danger)}
.empty{padding:26px 10px;text-align:center;color:var(--ink-3);font-size:13.5px;line-height:1.8}
.empty svg{width:30px;height:30px;color:var(--ink-3);opacity:.55;margin-bottom:8px}

/* ===== 值日视图 ===== */
.duty-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.duty-week{font-size:13px;color:var(--ink-2);font-weight:500}
.duty-table{width:100%;border-collapse:collapse;margin-top:6px}
.duty-table th{font-size:12px;color:var(--ink-3);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.duty-table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.duty-table tr:last-child td{border-bottom:none}
.duty-area{display:flex;align-items:center;gap:9px;font-weight:700}
.duty-area svg{width:17px;height:17px;color:var(--primary)}
.done-badge{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:700;font-size:13px}
.done-badge svg{width:15px;height:15px}
.person-cell{display:flex;align-items:center;gap:8px;font-weight:500}
.hist-week{display:flex;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line);align-items:center}
.hist-week:last-child{border-bottom:none}
.hist-week .wk{width:104px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.hist-dots{display:flex;gap:8px;flex-wrap:wrap}
.hist-dot{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.hist-dot i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hist-dot i.done{background:var(--ok)}
.hist-dot i.no{background:#D9D5C9}

/* ===== 物品视图 ===== */
.stock-card{display:flex;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid var(--line)}
.stock-card:last-child{border-bottom:none}
.stock-icon{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--primary)}
.stock-icon.warn{background:var(--danger-soft);color:var(--danger)}
.stock-icon svg{width:20px;height:20px}
.stock-main{flex:1;min-width:0}
.stock-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.stock-meta{font-size:12px;color:var(--ink-2);margin-top:1px}
.stock-bar{height:7px;background:#EFEDE6;border-radius:5px;overflow:hidden;margin-top:7px;max-width:240px}
.stock-bar i{display:block;height:100%;border-radius:5px;background:var(--primary)}
.stock-bar i.warn{background:var(--danger)}
.stock-actions{display:flex;gap:6px;flex:none}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.item-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.item-top{display:flex;align-items:center;gap:10px}
.item-name{font-weight:700;font-size:14.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-qty{font-size:13px;color:var(--ink-2);display:flex;align-items:baseline;gap:3px}
.item-qty b{font-size:19px;font-weight:900;color:var(--ink)}
.item-qty .unit{font-size:11.5px}
.item-ops{display:flex;gap:7px;margin-top:2px}

/* ===== 公约视图 ===== */
.roster{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roster-item{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 6px;font-size:13.5px;font-weight:500}
.roster-item.me{border-color:var(--primary);background:var(--primary-soft)}
.me-tag{font-size:10px;font-weight:900;color:var(--primary);background:#fff;border:1px solid var(--primary);border-radius:5px;padding:0 4px}
.rm-x{background:none;border:none;color:var(--ink-3);width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:2px}
.rm-x:hover{background:var(--danger-soft);color:var(--danger)}
.rm-x svg{width:11px;height:11px}
.rule-card{padding:18px 20px;margin-bottom:14px}
.rule-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rule-title{font-size:15.5px;font-weight:900;flex:1;min-width:140px}
.rule-content{font-size:13.5px;color:var(--ink-2);margin:4px 0 12px;line-height:1.75}
.sign-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sign-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px 4px 5px;font-size:12.5px;color:var(--ink-2);transition:all .12s}
.sign-chip.on{border-color:var(--ok);background:#E4F2E9;color:var(--ok);font-weight:700}
.sign-chip .ck{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sign-chip.on .ck{background:var(--ok);border-color:var(--ok)}
.sign-chip.on .ck svg{width:10px;height:10px;stroke:#fff}
.progress{height:9px;background:#EFEDE6;border-radius:6px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .4s ease}
.progress.amber i{background:var(--accent)}
.progress.red i{background:var(--danger)}

/* ===== 底部标签栏 ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;color:var(--ink-3);text-decoration:none;font-size:10.5px;font-weight:500}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--primary);font-weight:700}

/* ===== 响应式 ===== */
@media(max-width:959px){
  .side{display:none}
  .main{margin-left:0}

function dutyOf(week,rms){rms=rms||S.roommates;const m=week.match(/^(\d+)-W(\d+)$/);const n=rms.length||1;const base=(+m[1]*53+(+m[2]))%n;const out={};AREAS.forEach((a,idx)=>{out[a.id]=rms[(base+idx)%n].id;});return out;}

  ];
  // 上月数据
  const lastM=new Date(now.getFullYear(),now.getMonth(),1);
  lastM.setDate(lastM.getDate()-1);
  const lm=lastM.getFullYear()+'-'+String(lastM.getMonth()+1).padStart(2,'0');
  exps.push(

    E('水电燃气费',212.5,r2.id,'水电燃气',lm+'-10',ids),

    E('日用品采购',78,r3.id,'生活用品',lm+'-22',ids),

  );
  const items=[
    {id:uid(),name:'垃圾袋',cat:'生活耗材',qty:2,threshold:5,unit:'卷'},
    {id:uid(),name:'洗衣液',cat:'清洁用品',qty:1,threshold:1,unit:'瓶'},

  ];

function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);if(S&&Array.isArray(S.roommates)&&S.roommates.length&&Array.isArray(S.expenses)){return;}}}catch(e){}S=defaultState();save();}

function toast(msg){const root=$('#toast-root');const t=document.createElement('div');t.className='toast';t.innerHTML=ICONS.check+'<span>'+esc(msg)+'</span>';root.appendChild(t);setTimeout(()=>{t.style.transition='all .3s';t.style.opacity='0';t.style.transform='translateY(-8px)';setTimeout(()=>t.remove(),320);},2100);}

/* ===== 费用计算 ===== */
function expsSorted(){return S.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date));}
function expsOfMonth(month){return S.expenses.filter(e=>e.date.slice(0,7)===month);}
function thisMonth(){return dstr(new Date()).slice(0,7);}
function lastMonth(){const d=new Date();d.setDate(0);return dstr(d).slice(0,7);}
function personShare(e){return e.amount/(e.participantIds.length||1);}
function balances(list){const net={};S.roommates.forEach(r=>net[r.id]=0);list.forEach(e=>{const payer=S.roommates.some(r=>r.id===e.payerId)?e.payerId:S.roommates[0].id;const share=personShare(e);const others=e.participantIds.filter(pid=>pid!==payer);net[payer]+=share*others.length;others.forEach(pid=>{net[pid]-=share;});});return net;}
function settle(net){const debt=[],cred=[];Object.keys(net).forEach(id=>{const v=net[id];if(v<-0.005)debt.push({id,v:-v});else if(v>0.005)cred.push({id,v});});const out=[];let i=0,j=0;while(i<debt.length&&j<cred.length){const d=debt[i],c=cred[j];const amt=Math.min(d.v,c.v);if(amt>0.005)out.push({from:d.id,to:c.id,amt});d.v-=amt;c.v-=amt;if(d.v<0.005)i++;if(c.v<0.005)j++;}return out;}
function itemLow(it){return it.qty<=it.threshold;}
/* ===== 路由与导航 ===== */
function currentPage(){const h=location.hash.replace(/^#\/?/,'').split('?')[0];return NAV.some(n=>n.id===h)?h:'home';}

function renderAll(){const p=currentPage();renderNav(p);const meta=PAGES[p];$('#page-title').textContent=meta[0];$('#page-sub').textContent=meta[1];const el=$('#content');if(p==='home')el.innerHTML=viewHome();else if(p==='expense')el.innerHTML=viewExpense();else if(p==='cleaning')el.innerHTML=viewCleaning();else if(p==='items')el.innerHTML=viewItems();else el.innerHTML=viewRules();window.scrollTo(0,0);}

function catTotals(exps){const t={};exps.forEach(e=>{t[e.cat]=(t[e.cat]||0)+e.amount;});return t;}
function donutCss(catT){const entries=Object.entries(catT);const total=entries.reduce((s,[,v])=>s+v,0);if(!total)return 'conic-gradient(#E7E3D9 0 100%)';let acc=0;const parts=entries.map(([cat,v])=>{const s=acc/total*100;acc+=v;const e=acc/total*100;return (EXPCAT[cat]||'#8A97A0')+' '+s.toFixed(2)+'% '+e.toFixed(2)+'%';});return 'conic-gradient('+parts.join(',')+')';}
function viewFlow(expsM,total){
  const catT=catTotals(expsM);const entries=Object.entries(catT).sort((a,b)=>b[1]-a[1]);
  const donut='<div class="donut" style="background:'+donutCss(catT)+'"><div class="donut-hole"><b>'+fmtMoney(total)+'</b><span>本月总支出</span></div></div>';
  const legend=entries.map(([cat,v])=>'<div class="legend-row"><span class="legend-dot" style="background:'+(EXPCAT[cat]||'#8A97A0')+'"></span><span>'+esc(cat)+'</span><span class="p">'+Math.round(v/total*100)+'%</span><span class="v">'+fmtMoney(v)+'</span></div>').join('')||'<div class="legend-row">暂无数据</div>';
  const maxPaid=Math.max(1,...S.roommates.map(r=>expsM.filter(e=>e.payerId===r.id).reduce((s,e)=>s+e.amount,0)));
  const bars=S.roommates.map(r=>{const v=expsM.filter(e=>e.payerId===r.id).reduce((s,e)=>s+e.amount,0);return '<div class="bar-row"><div class="bar-name">'+avatarHtml(r)+' '+esc(r.name)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(v/maxPaid*100,2)+'%"></div></div><div class="bar-val">'+fmtMoney(v)+'</div></div>';}).join('');
  const trend=trend7Html();
  const groups={};expsSorted().forEach(e=>{(groups[e.date]=groups[e.date]||[]).push(e);});
  const listHtml=Object.keys(groups).map(ds=>'<div class="expense-date">'+fmtDate(ds)+'</div>'+groups[ds].map(e=>{
    const r=rm(e.payerId);
    return '<div class="row"><div class="stock-icon" style="width:38px;height:38px">'+ICONS.receipt+'</div><div class="row-main"><div class="row-title">'+esc(e.desc)+'</div><div class="row-sub"><span class="chip '+(e.cat==='房租'?'blue':'teal')+'">'+esc(e.cat)+'</span><span>'+esc(r.name)+' 垫付 · '+e.participantIds.length+' 人 AA</span></div></div><div style="text-align:right"><div class="amount plain">'+fmtMoney(e.amount)+'</div><button class="section-link" style="font-size:11.5px" onclick="delExpense(\''+e.id+'\')">删除</button></div></div>';
  }).join('')).join('');
  return '<div class="cols" style="margin-top:18px">'
    +'<div class="card"><div class="section-title" style="margin-bottom:12px">分类占比</div><div class="donut-wrap">'+donut+'<div class="legend">'+legend+'</div></div></div>'
    +'<div class="card"><div class="section-title" style="margin-bottom:12px">每人垫付（本月）</div>'+bars+'</div>'
    +'</div>'
    +'<div class="card" style="margin-top:16px"><div class="section-title" style="margin-bottom:12px">近 7 天支出</div>'+trend+'</div>'
    +'<div class="section"><div class="section-head"><div class="section-title">全部流水</div><span class="row-sub">共 '+S.expenses.length+' 笔</span></div><div class="card">'+(listHtml||emptyHtml('还没有费用记录，点右上角「记一笔费用」开始。'))+'</div></div>';
}
function trend7Html(){
  const pts=[];for(let i=6;i>=0;i--){const ds=daysAgo(i);const v=S.expenses.filter(e=>e.date===ds).reduce((s,e)=>s+e.amount,0);pts.push({ds,v});}
  const max=Math.max(1,...pts.map(p=>p.v));
  const W=340,H=96,PAD=6;
  const px=i=>PAD+i*(W-2*PAD)/6;
  const py=v=>H-PAD-(v/max)*(H-2*PAD-14);
  const line=pts.map((p,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ');
  const area=line+' L'+px(6).toFixed(1)+' '+(H-PAD)+' L'+px(0).toFixed(1)+' '+(H-PAD)+' Z';
  const dots=pts.map((p,i)=>'<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p.v).toFixed(1)+'" r="2.6" fill="#0E6B5C"/>').join('');
  const labels=pts.map((p,i)=>'<text x="'+px(i).toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle" font-size="9" fill="#98A49F">'+'周'+['日','一','二','三','四','五','六'][new Date(p.ds+'T00:00:00').getDay()]+'</text>').join('');
  const vals=pts.map((p,i)=>p.v?'<text x="'+px(i).toFixed(1)+'" y="'+(py(p.v)-7).toFixed(1)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#22312C">'+fmtMoney(p.v).replace('¥','')+'</text>':'').join('');
  return '<div class="trend-wrap"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'
    +'<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E6B5C" stop-opacity=".18"/><stop offset="1" stop-color="#0E6B5C" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#tg)"/><path d="'+line+'" fill="none" stroke="#0E6B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+vals+labels
    +'</svg></div>';
}

  const allSigns=S.rules.length*S.roommates.length;
  const pct=allSigns?Math.round(totSigns/allSigns*100):0;
  const roster=S.roommates.map(r=>'<span class="roster-item'+(r.id===S.meId?' me':'')+'">'+avatarHtml(r)+nameHtml(r)+(r.id===S.meId?'':'<button class="rm-x" onclick="removeRoommate(\''+r.id+'\')" title="移除">'+ICONS_X+'</button>')+'</span>').join('');
  const rules=S.rules.map(r=>{
    const signed=S.ruleSigns[r.id]||[];
    const n=signed.length;const prog=Math.round(n/S.roommates.length*100);
    const chips=S.roommates.map(m=>'<button class="sign-chip'+(signed.includes(m.id)?' on':'')+'" onclick="toggleSign(\''+r.id+'\',\''+m.id+'\')"><span class="ck">'+(signed.includes(m.id)?ICONS.check:'')+'</span>'+avatarHtml(m,'sm')+esc(m.name)+'</button>').join('');
    return '<div class="card rule-card"><div class="rule-head"><span class="chip '+(r.cat==='清洁卫生'||r.cat==='公共区域'?'green':r.cat==='费用'?'blue':r.cat==='访客'?'amber':'teal')+'">'+esc(r.cat)+'</span><div class="rule-title">'+esc(r.title)+'</div><button class="section-link" style="color:var(--danger)" onclick="delRule(\''+r.id+'\')">删除</button></div>'
      +'<div class="rule-content">'+esc(r.content)+'</div>'
      +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><div class="progress'+(n===S.roommates.length?'':' amber')+'" style="max-width:220px"><i style="width:'+prog+'%"></i></div><span class="row-sub">'+n+' / '+S.roommates.length+' 已签署</span></div>'
      +'<div class="sign-row">'+chips+'</div></div>';
  }).join('');
  return '<div class="card"><div class="section-head" style="margin-bottom:10px"><div class="section-title">'+ICONS.users+' 室友名单</div><button class="btn primary sm" onclick="openRoommateModal()">'+ICONS.plus+'添加室友</button></div><div class="roster">'+roster+'</div></div>'
    +'<div class="card" style="margin-top:16px"><div class="section-head" style="margin-bottom:10px"><div class="section-title">总体签署进度</div><span class="row-sub">'+totSigns+' / '+allSigns+' 人次 · '+pct+'%</span></div><div class="progress'+(pct===100?'':' amber')+'"><i style="width:'+pct+'%"></i></div><div class="row-sub" style="margin-top:8px">点击下方任意室友头像即可切换签署状态（演示数据可直接体验）</div></div>'
    +'<div class="section"><div class="section-head"><div class="section-title">公约条款</div><button class="btn primary sm" onclick="openRuleModal()">'+ICONS.plus+'新增公约</button></div>'+rules+'</div>';
}
function toggleSign(rid,mid){
  const arr=S.ruleSigns[rid]=S.ruleSigns[rid]||[];
  const i=arr.indexOf(mid);
  if(i>=0){arr.splice(i,1);toast('已取消签署');}
  else{arr.push(mid);toast('已签署，说到做到');}
  save();renderAll();
}
function delRule(id){if(!confirm('确定删除这条公约吗？'))return;delete S.ruleSigns[id];S.rules=S.rules.filter(r=>r.id!==id);save();renderAll();toast('已删除公约');}
/* ===== 弹窗表单与操作 ===== */
const ICONS_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
function field(label,inner){return '<div class="field"><label>'+label+'</label>'+inner+'</div>';}
let M=null;

function openExpenseModal(id){
  const e=id?S.expenses.find(x=>x.id===id):null;
  M={participants:e?e.participantIds.slice():S.roommates.map(r=>r.id)};
  const payerOpts=S.roommates.map(r=>'<option value="'+r.id+'"'+(e&&e.payerId===r.id?' selected':'')+'>'+esc(r.name)+'</option>').join('');
  const catOpts=EXPCATS.map(c=>'<option'+(e&&e.cat===c?' selected':'')+'>'+c+'</option>').join('');
  const chips=S.roommates.map(r=>'<button type="button" class="check-chip'+(M.participants.includes(r.id)?' on':'')+'" data-rid="'+r.id+'" onclick="togglePart(\''+r.id+'\')">'+avatarHtml(r,'sm')+esc(r.name)+'</button>').join('');
  openModal('<div class="modal-head"><div class="modal-title">'+(id?'编辑费用':'记一笔费用')+'</div><button type="button" class="modal-x" onclick="closeModal()">'+ICONS_X+'</button></div>'
    +'<form onsubmit="submitExpense(event,'+(id?'\''+id+'\'':'null')+')">'
    +field('描述', '<input class="input" name="desc" required maxlength="40" placeholder="例如：9 月房租" value="'+esc(e?e.desc:'')+'">')
    +field('金额（元）', '<input class="input" name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00" value="'+(e?e.amount:'')+'">')
    +field('支付人（谁先垫付）', '<div class="select-wrap"><select class="input" name="payer">'+payerOpts+'</select></div>')
    +field('分类', '<div class="select-wrap"><select class="input" name="cat">'+catOpts+'</select></div>')
    +field('日期', '<input class="input" name="date" type="date" required value="'+(e?e.date:dstr(new Date()))+'">')
    +field('参与 AA 的人', '<div class="chip-row" id="part-chips">'+chips+'</div>')
    +field('备注（可选）', '<input class="input" name="note" maxlength="60" placeholder="补充说明" value="'+esc(e?e.note:'')+'">')
    +'<div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button type="submit" class="btn primary">保存</button></div></form>');
}
function togglePart(rid){
  const i=M.participants.indexOf(rid);
  if(i>=0)M.participants.splice(i,1);else M.participants.push(rid);
  const el=$('#part-chips [data-rid="'+rid+'"]');
  if(el)el.classList.toggle('on',M.participants.includes(rid));
}
function submitExpense(ev,id){
  ev.preventDefault();const f=ev.target;
  const desc=f.desc.value.trim();const amount=parseFloat(f.amount.value);
  if(!desc){toast('请填写费用描述');return;}
  if(!(amount>0)){toast('金额需大于 0');return;}
  if(!M||!M.participants.length){toast('至少选择一位参与 AA 的室友');return;}
  if(!S.roommates.some(r=>r.id===f.payer.value)){toast('支付人无效');return;}
  const rec={id:id||uid(),desc,amount:+amount.toFixed(2),payerId:f.payer.value,cat:f.cat.value,date:f.date.value,participantIds:M.participants.slice(),note:f.note.value.trim()};
  if(id){const i=S.expenses.findIndex(x=>x.id===id);if(i>=0)S.expenses[i]=rec;}
  else S.expenses.push(rec);
  save();closeModal();toast('费用已记录，AA 自动算好');
  renderAll();
}
function delExpense(id){
  if(!confirm('确定删除这笔费用记录吗？'))return;
  S.expenses=S.expenses.filter(e=>e.id!==id);
  save();renderAll();toast('已删除记录');
}

function openItemModal(id){
  const it=id?S.items.find(x=>x.id===id):null;
  const catOpts=ITEMCATS.map(c=>'<option'+(it&&it.cat===c?' selected':'')+'>'+c+'</option>').join('');
  openModal('<div class="modal-head"><div class="modal-title">'+(id?'编辑物品':'登记公共物品')+'</div><button type="button" class="modal-x" onclick="closeModal()">'+ICONS_X+'</button></div>'
    +'<form onsubmit="submitItem(event,'+(id?'\''+id+'\'':'null')+')">'
    +field('物品名称', '<input class="input" name="name" required maxlength="20" placeholder="例如：洗衣液" value="'+esc(it?it.name:'')+'">')
    +field('分类', '<div class="select-wrap"><select class="input" name="cat">'+catOpts+'</select></div>')
    +field('当前数量', '<input class="input" name="qty" type="number" step="1" min="0" required value="'+(it?it.qty:'2')+'">')
    +field('低库存提醒线（数量 ≤ 提醒线时提示采购）', '<input class="input" name="threshold" type="number" step="1" min="1" required value="'+(it?it.threshold:'2')+'">')
    +field('单位', '<input class="input" name="unit" required maxlength="6" placeholder="瓶 / 卷 / 袋" value="'+esc(it?it.unit:'')+'">')
    +'<div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button type="submit" class="btn primary">保存</button></div></form>');
}
function submitItem(ev,id){
  ev.preventDefault();const f=ev.target;
  const name=f.name.value.trim();
  if(!name){toast('请填写物品名称');return;}
  const qty=parseInt(f.qty.value,10);const threshold=parseInt(f.threshold.value,10);
  if(isNaN(qty)||qty<0){toast('数量无效');return;}
  if(isNaN(threshold)||threshold<1){toast('提醒线需 ≥ 1');return;}
  const rec={id:id||uid(),name,cat:f.cat.value,qty,threshold,unit:f.unit.value.trim()||'件'};
  if(id){const i=S.items.findIndex(x=>x.id===id);if(i>=0)S.items[i]=rec;}
  else S.items.push(rec);
  save();closeModal();toast('物品已登记');
  renderAll();
}

function openRuleModal(){
  const catOpts=RULECATS.map(c=>'<option>'+c+'</option>').join('');
  openModal('<div class="modal-head"><div class="modal-title">新增公约</div><button type="button" class="modal-x" onclick="closeModal()">'+ICONS_X+'</button></div>'
    +'<form onsubmit="submitRule(event)">'
    +field('分类', '<div class="select-wrap"><select class="input" name="cat">'+catOpts+'</select></div>')
    +field('条款标题', '<input class="input" name="title" required maxlength="30" placeholder="例如：晚上 11 点后保持安静">')
    +field('条款内容', '<textarea class="input" name="content" required maxlength="200" placeholder="写清楚约定和边界，越具体越好执行"></textarea>')
    +'<div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button type="submit" class="btn primary">发起签署</button></div></form>');
}
function submitRule(ev){
  ev.preventDefault();const f=ev.target;
  const title=f.title.value.trim();const content=f.content.value.trim();
  if(!title||!content){toast('请填写标题和内容');return;}
  const rec={id:uid(),title,cat:f.cat.value,content,createdAt:dstr(new Date())};
  S.rules.unshift(rec);S.ruleSigns[rec.id]=[];
  save();closeModal();toast('公约已发布，快@室友来签');
  renderAll();
}

function openRoommateModal(){
  openModal('<div class="modal-head"><div class="modal-title">添加室友</div><button type="button" class="modal-x" onclick="closeModal()">'+ICONS_X+'</button></div>'
    +'<form onsubmit="submitRoommate(event)">'
    +field('室友昵称', '<input class="input" name="name" required maxlength="10" placeholder="例如：小林">')
    +'<div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button type="submit" class="btn primary">加入合租</button></div></form>');
}
function submitRoommate(ev){
  ev.preventDefault();const name=ev.target.name.value.trim();
  if(!name){toast('请填写昵称');return;}
  if(S.roommates.some(r=>r.name===name)){toast('已有同名室友');return;}
  S.roommates.push({id:uid(),name,color:AV_COLORS[S.roommates.length%AV_COLORS.length]});
  save();closeModal();toast('欢迎 '+name+' 入住');
  renderAll();
}
function removeRoommate(id){
  if(id===S.meId){toast('不能移除自己');return;}
  if(!confirm('确定移除 '+rm(id).name+' 吗？相关账目与签署记录会自动整理。'))return;
  S.roommates=S.roommates.filter(r=>r.id!==id);
  S.expenses.forEach(e=>{
    e.participantIds=e.participantIds.filter(pid=>pid!==id);
    if(e.payerId===id)e.payerId=S.meId;
  });
  Object.keys(S.ruleSigns).forEach(k=>{S.ruleSigns[k]=S.ruleSigns[k].filter(x=>x!==id);});
  save();renderAll();toast('已移除室友');
}

function openSettings(){
  openModal('<div class="modal-head"><div class="modal-title">设置</div><button type="button" class="modal-x" onclick="closeModal()">'+ICONS_X+'</button></div>'
    +'<form onsubmit="submitSettings(event)">'
    +field('公寓名称', '<input class="input" name="flatname" required maxlength="30" value="'+esc(S.flat.name)+'">')
    +'<div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">取消</button><button type="submit" class="btn primary">保存</button></div></form>'
    +'<div class="section" style="margin-top:6px"><div class="section-title" style="margin-bottom:10px">数据</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn ghost" onclick="resetDemo()">重置演示数据</button><button type="button" class="btn danger" onclick="clearAll()">清空所有数据</button></div>'
    +'<div class="row-sub" style="margin-top:14px">演示版本：数据保存在当前浏览器 localStorage，仅本机可见。适合先体验流程；多人协作版可接入云端账号。</div></div>');
}
function submitSettings(ev){
  ev.preventDefault();
  const name=ev.target.flatname.value.trim();
  if(!name){toast('公寓名称不能为空');return;}
  S.flat.name=name;
  save();closeModal();toast('已保存');renderAll();
}

/* ===== 初始化 ===== */
load();
$('#btn-settings').innerHTML=ICONS.gear;
$('#btn-settings').onclick=openSettings;
$('#modal-mask').addEventListener('click',e=>{if(e.target.id==='modal-mask')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('hashchange',renderAll);
renderAll();
</script>
</body>
</html>
